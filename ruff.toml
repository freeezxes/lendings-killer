# Ruff config — CI "Test & Quality" gate.
#
# We intentionally gate only on the "code will crash at runtime" rule set
# (syntax errors + undefined names / broken constructs) rather than full style
# lint, so the pipeline stays high-signal on a large legacy codebase.
target-version = "py312"
line-length = 120

exclude = [
    "venv",
    "venv_playwright",
    "generated_sites",
    "alembic/versions",
    "__pycache__",
]

[lint]
# E9  = syntax errors
# F63 = invalid comparisons / assertions
# F7  = misplaced statements (break/continue/return outside function, etc.)
# F82 = undefined names (catches the class of bug that broke app boot)
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# BASELINE of pre-existing bugs surfaced by this gate. Each is a real defect
# (helpers lost during the Phase 4 ORM refactor) that needs a proper fix, not
# suppression. Tracked separately; remove the ignore once fixed so the gate
# guards them again. NEW undefined names elsewhere still fail CI.
#   api/routers/admin.py    -> _admin_count, _admin_stats, _admin_users undefined
#   api/routers/payments.py -> `session` undefined in promo_credit_log call
"api/routers/admin.py" = ["F821"]
"api/routers/payments.py" = ["F821"]
